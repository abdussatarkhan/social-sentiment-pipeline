[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "social_sentiment_pipeline"
version = "1.0.0"
description = "Real-Time Social Listening & Brand Sentiment Pipeline (Bluesky, Reddit, Kafka, DistilBERT, CUSUM, Airflow, Elasticsearch, Grafana)"
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
